name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aavaran
          POSTGRES_PASSWORD: aavaran
          POSTGRES_DB: aavaran_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aavaran" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aavaran:aavaran@localhost:5432/aavaran_test
      TEST_DATABASE_URL: postgresql://aavaran:aavaran@localhost:5432/aavaran_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
